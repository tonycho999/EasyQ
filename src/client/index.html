<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EasyQ - 스마트 웨이팅</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>

    <div class="container">
        <header>
            <h1 id="shop-name">EasyQ 매장</h1>
            <p class="subtitle">모바일 스마트 대기열</p>
        </header>

        <div id="register-section" class="section">
            <div class="input-group">
                <label for="user-name">방문자명</label>
                <input type="text" id="user-name" placeholder="이름을 입력해주세요" autocomplete="off">
            </div>
            
            <div class="input-group">
                <label for="user-count">방문 인원</label>
                <input type="number" id="user-count" placeholder="명" min="1" max="20" inputmode="numeric">
            </div>

            <button id="btn-register" class="btn-primary">대기 등록하기</button>
            
            <p class="notice">* 등록 후 화면을 끄지 마세요. 실시간으로 순서가 업데이트됩니다.</p>
        </div>

        <div id="status-section" class="section hidden">
            <div class="status-card">
                <p class="status-label">현재 내 대기 순서</p>
                <div class="turn-number">
                    <span id="my-turn">0</span><span class="unit">번째</span>
                </div>
                <p id="status-message" class="status-message">곧 입장 순서입니다. 매장 근처에서 대기해주세요.</p>
            </div>

            <div class="info-group">
                <p>대기 번호: <strong id="my-ticket-number">000</strong></p>
                <p>등록 인원: <strong id="my-count">0</strong>명</p>
            </div>

            <p class="final-notice">순서가 되면 점원이 호명하거나 알림이 울립니다.<br>(브라우저 소리를 켜두시면 좋습니다.)</p>
        </div>
        
        <div id="loading" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p>등록 중...</p>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
