<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EasyQ - 스마트 웨이팅</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="alert-sound" src="../../public/dingdong.mp3" preload="auto"></audio>
    <div class="container">
        <header>
            <h1 id="shop-name" data-i18n="title">EasyQ 매장</h1>
            <p class="subtitle" data-i18n="subtitle">모바일 스마트 대기열</p>
        </header>

        <div id="register-section" class="section">
            <div class="input-group">
                <label for="user-name" data-i18n="nameLabel">방문자명</label>
                <input type="text" id="user-name" data-i18n-placeholder="namePlaceholder" placeholder="이름을 입력해주세요" autocomplete="off">
            </div>
            
            <div class="input-group">
                <label for="user-phone" data-i18n="phoneLabel">연락처</label>
                <input type="tel" id="user-phone" data-i18n-placeholder="phonePlaceholder" placeholder="전화번호를 입력해주세요" autocomplete="tel">
            </div>
            
            <div class="input-group">
                <label for="user-count" data-i18n="countLabel">방문 인원</label>
                <input type="number" id="user-count" data-i18n-placeholder="countPlaceholder" placeholder="명" min="1" max="20" inputmode="numeric">
            </div>

            <button id="btn-register" class="btn-primary" data-i18n="btnRegister">대기 등록하기</button>
            
            <p class="notice" data-i18n="notice">* 등록 후 화면을 끄지 마세요. 실시간으로 순서가 업데이트됩니다.</p>
        </div>

        <div id="status-section" class="section hidden">
            <div class="status-card">
                <p class="status-label" data-i18n="statusLabel">현재 내 대기 순서</p>
                <div class="turn-number">
                    <span id="my-turn">0</span><span class="unit" data-i18n="turnUnit">번째</span>
                </div>
                <p id="status-message" class="status-message" data-i18n="statusMessageWait">곧 입장 순서입니다. 매장 근처에서 대기해주세요.</p>
            </div>

            <div class="info-group">
                <p><span data-i18n="infoTicket">대기 번호:</span> <strong id="my-ticket-number">000</strong></p>
                <p><span data-i18n="infoCount">등록 인원:</span> <strong id="my-count">0</strong><span data-i18n="infoCountUnit">명</span></p>
            </div>

            <p class="final-notice" data-i18n="finalNotice">순서가 되면 점원이 호명하거나 알림이 울립니다.</p>
        </div>
        
        <div id="loading" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p data-i18n="loading">처리 중...</p>
        </div>
    </div>

    <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
    <script src="../shared/api.js"></script>
    <script src="../shared/pusher-setup.js"></script>
    <script src="app.js"></script>
</body>
</html>
